name: CI

on:
  push:
  pull_request:

jobs:
  test-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e library/sungrow-modbus[dev]
      - run: pytest library/sungrow-modbus/tests
      - run: ruff check library/sungrow-modbus
