[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sungrow-modbus"
version = "0.0.1"
description = "Backend-neutral Modbus device model for Sungrow SG-series inverters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "fjonson" }]
dependencies = [
    "modbus-connection>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "modbus-connection[testing]>=0.1",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sungrow_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
